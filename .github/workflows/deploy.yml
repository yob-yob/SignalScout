name: Deploy

# On a push to main (or by hand from the Actions tab): test and build here, then upload the
# static build to the SignalScout LXC on homelab01, jumping through vps03 (the LXC has no
# public address). Set up by the infrastructure repo, playbooks/homelab-apps.yml; the one
# key can only open a tunnel to the LXC on vps03, and only run `deploy-static signalscout`
# on the LXC, which unpacks the upload and switches the site to it:
#   secret   DEPLOY_SSH_KEY      private key
#   variable DEPLOY_HOST         the LXC's LAN address
#   variable DEPLOY_JUMP         deploy-jump@vps03.yob-yob.com
#   variable DEPLOY_KNOWN_HOSTS  host keys of vps03 and the LXC, so both hops are verified
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build

      - name: Upload the build to the SignalScout LXC
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          JUMP: ${{ vars.DEPLOY_JUMP }}
          COMMIT: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -czf - -C build . | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ProxyCommand="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -W %h:%p $JUMP" \
            "root@$HOST" "deploy $COMMIT"
