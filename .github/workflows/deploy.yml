name: Deploy

# On a push to main (or by hand from the Actions tab): run the tests, then SSH to vps02
# with a key that can only run `deploy-project signalscout` there (set up by the
# infrastructure repo, playbooks/vps02-projects.yml):
#   secret   VPS02_DEPLOY_KEY   private key for that restricted login
#   variable VPS02_HOST         vps02.yob-yob.com
#   variable VPS02_KNOWN_HOSTS  vps02's SSH host key, so the connection is verified
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps02
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to vps02
        env:
          DEPLOY_KEY: ${{ secrets.VPS02_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ vars.VPS02_KNOWN_HOSTS }}
          HOST: ${{ vars.VPS02_HOST }}
          COMMIT: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "root@$HOST" "deploy $COMMIT"
